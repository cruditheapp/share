<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouvrir CrudiThé</title>
  <script>
    // Récupère les paramètres de l'URL (tokens de Supabase)
    const params = window.location.search || window.location.hash;
    // Redirige vers l'app sur la page de connexion
    window.location.href = 'crudithe://cruditheapp.com/authentificationConnexion' + params;
  </script>
</head>
<body>
  <p>Redirection vers CrudiThé App...</p>
  <p>Si l'application ne s'ouvre pas automatiquement, <a id="manual-link" href="crudithe://cruditheapp.com/authentificationConnexion">clique ici</a>.</p>
  <script>
    document.getElementById('manual-link').href = 'crudithe://cruditheapp.com/authentificationConnexion' + (window.location.search || window.location.hash);
  </script>
</body>
</html>
