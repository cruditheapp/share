<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouvre dans CrudiThé</title>
  
  <meta property="og:title" content="Découvre ce spot sur CrudiThé 🌱">
  <meta property="og:description" content="L'annuaire vegan francophone">
  <meta property="og:image" content="https://hvnderbvaxzjswdvxpgs.supabase.co/storage/v1/object/public/avatars/Logo%20CrudiThe.png">
  <meta property="og:type" content="website">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f8f1;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(138,198,64,0.07) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -15%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(1,149,73,0.05) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 44px 32px 36px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .logo {
      width: 140px;
      height: auto;
      margin: 0 auto 32px;
      display: block;
      animation: fadeIn 0.5s ease 0.15s both;
    }
    .discover-label {
      font-size: 15px;
      color: #aaa;
      font-weight: 400;
      margin-bottom: 8px;
      animation: fadeIn 0.4s ease 0.25s both;
    }
    .spot-name {
      font-size: 28px;
      font-weight: 700;
      color: #019549;
      line-height: 1.25;
      margin-bottom: 32px;
      min-height: 35px;
      animation: fadeIn 0.4s ease 0.35s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #019549, #017a3d);
      color: white;
      padding: 16px 40px;
      border-radius: 16px;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 17px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(1, 149, 73, 0.3);
      width: 100%;
      max-width: 280px;
      animation: fadeIn 0.4s ease 0.45s both;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(1, 149, 73, 0.35);
    }
    .btn-open:active {
      transform: translateY(0);
    }
    .btn-icon {
      font-size: 18px;
      transition: transform 0.25s ease;
    }
    .btn-open:hover .btn-icon {
      transform: translateX(3px);
    }
    .divider {
      width: 50px;
      height: 1px;
      background: #e8e8e8;
      margin: 28px auto 20px;
      animation: fadeIn 0.4s ease 0.55s both;
    }
    .store-text {
      font-size: 13px;
      color: #b0b0b0;
      margin-bottom: 14px;
      animation: fadeIn 0.4s ease 0.6s both;
    }
    
    .store-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      animation: fadeIn 0.4s ease 0.65s both;
    }
    
    .btn-store {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    
    .btn-store:hover {
      background: #333;
      transform: translateY(-1px);
    }
    /* Loading shimmer */
    .name-loading {
      display: inline-block;
      width: 160px;
      height: 28px;
      background: linear-gradient(90deg, #e8f5e0 25%, #f5faf2 50%, #e8f5e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      vertical-align: middle;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (max-width: 400px) {
      .card {
        padding: 36px 24px 28px;
        border-radius: 24px;
      }
      .spot-name {
        font-size: 24px;
      }
      .btn-open {
        padding: 14px 32px;
        font-size: 16px;
      }
      .store-buttons {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://hvnderbvaxzjswdvxpgs.supabase.co/storage/v1/object/public/avatars/Logo%20CrudiThe.png" 
     alt="CrudiThé" 
     class="logo">
    
    <p class="discover-label" id="discover-label">Découvre</p>
    <div id="spot-name" class="spot-name notranslate" translate="no">
      <span class="name-loading"></span>
    </div>
    
    <a id="open-app-btn" href="#" class="btn-open">
      <span id="btn-text">Ouvrir dans l'app</span>
      <span class="btn-icon">→</span>
    </a>
    <div class="divider"></div>
    <p class="store-text" id="store-text">Pas encore l'app ? Télécharge-la !</p>
    <div class="store-buttons">
      <a href="https://apps.apple.com/app/crudithe/id6756739944" class="btn-store">
        🍎 App Store
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.crudithe.app" class="btn-store">
        ▶️ Google Play
      </a>
    </div>
  </div>
  <script>
    // ===== CONFIG SUPABASE =====
    var SUPABASE_URL = 'https://hvnderbvaxzjswdvxpgs.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2bmRlcmJ2YXh6anN3ZHZ4cGdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwNzAyNzEsImV4cCI6MjA3MzY0NjI3MX0.SqWpfZ4kjW74tU3cD5UvnyRjVXmYaMKjdDs7cgPkSUw';
    // ===== PARAMÈTRES URL =====
    var urlParams = new URLSearchParams(window.location.search);
    var type = urlParams.get('type');
    var id = urlParams.get('id');
    var barcode = urlParams.get('barcode');
    var lang = urlParams.get('lang') || 'fr';
    // ===== MAPPING TABLES =====
    function getRecipeColumn(currentLang) {
      if (currentLang === 'en') return 'nom_recette_en';
      if (currentLang === 'es') return 'nom_recette_es';
      return 'nom_recette';
    }
    var typeConfig = {
      restaurant: { 
        table: 'restaurants', 
        column: 'namespot',
        fallbackColumn: null
      },
      recipe: { 
        table: 'recettes', 
        column: getRecipeColumn(lang),
        fallbackColumn: 'nom_recette'
      },
      event: { 
        table: 'events', 
        column: 'title',
        fallbackColumn: null
      },
      producteur: { 
        table: 'producteurs', 
        column: 'namespot',
        fallbackColumn: null
      }
    };

    // ===== ÉLÉMENTS DOM =====
    var spotNameEl = document.getElementById('spot-name');
    var btnEl = document.getElementById('open-app-btn');
    var btnTextEl = document.getElementById('btn-text');
    var discoverEl = document.getElementById('discover-label');
    var storeTextEl = document.getElementById('store-text');
    // ===== TRADUCTIONS =====
    if (lang === 'en') {
      discoverEl.textContent = 'Discover';
      btnTextEl.textContent = 'Open in app';
      storeTextEl.textContent = "Don't have the app? Download it!";
    } else if (lang === 'es') {
      discoverEl.textContent = 'Descubre';
      btnTextEl.textContent = 'Abrir en la app';
      storeTextEl.textContent = '¿No tienes la app? ¡Descárgala!';
    }
    // ===== DEEP LINK =====
    var deepLink = 'crudithe://cruditheapp.com';
    if (type === 'recipe' && id) {
      deepLink = 'crudithe://cruditheapp.com/recipeDetails?recipeId=' + id + '&fromShare=true&lang=' + lang;
    } else if (type === 'event' && id) {
      deepLink = 'crudithe://cruditheapp.com/eventDetails?eventId=' + id + '&fromShare=true&lang=' + lang;
    } else if (type === 'producteur' && id) {
      deepLink = 'crudithe://cruditheapp.com/producteurDetails?prodId=' + id + '&fromShare=true&lang=' + lang;
    } else if (type === 'restaurant' && id) {
      deepLink = 'crudithe://cruditheapp.com/restaurantDetails?restoId=' + id + '&fromShare=true&lang=' + lang;
    } else if (type === 'produit' && barcode) {
      deepLink = 'crudithe://cruditheapp.com/produitDetails?barcode=' + barcode + '&fromShare=true&lang=' + lang;
    }
    btnEl.href = deepLink;
    // ===== FETCH NOM DEPUIS SUPABASE =====
    var config = typeConfig[type] || null;
    async function fetchSpotName() {
      // ===== CAS SPÉCIAL PRODUIT (barcode + off_data JSONB) =====
      if (type === 'produit' && barcode) {
        try {
          var prodUrl = SUPABASE_URL + '/rest/v1/products_db?barcode=eq.' + barcode + '&select=off_data';
          var prodRes = await fetch(prodUrl, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
          });
          if (prodRes.ok) {
            var prodData = await prodRes.json();
            if (prodData && prodData.length > 0 && prodData[0].off_data) {
              var prodName = prodData[0].off_data.product_name || 'CrudiThé';
              var safeName = prodName.replace(/</g, '&lt;').replace(/>/g, '&gt;');
              spotNameEl.innerHTML = safeName;
              document.title = prodName + ' — CrudiThé';
              var ogTProd = document.querySelector('meta[property="og:title"]');
              if (ogTProd) ogTProd.setAttribute('content', prodName + ' sur CrudiThé 🌱');
              return;
            }
          }
          spotNameEl.textContent = 'CrudiThé';
        } catch (e) {
          console.log('Erreur fetch produit:', e);
          spotNameEl.textContent = 'CrudiThé';
        }
        return;
      }

      // ===== AUTRES TYPES (restaurant, recette, event, producteur) =====
      if (!config || !id) {
        spotNameEl.textContent = 'CrudiThé';
        return;
      }
      try {
        var columns = config.column;
        if (config.fallbackColumn && config.fallbackColumn !== config.column) {
          columns = config.column + ',' + config.fallbackColumn;
        }
        var apiUrl = SUPABASE_URL + '/rest/v1/' + config.table + '?id=eq.' + id + '&select=' + columns;
        var res = await fetch(apiUrl, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
          }
        });
        if (!res.ok) {
          spotNameEl.textContent = 'CrudiThé';
          return;
        }
        var data = await res.json();
        if (!data || data.length === 0) {
          spotNameEl.textContent = 'CrudiThé';
          return;
        }
        var name = data[0][config.column];
        if (!name && config.fallbackColumn) {
          name = data[0][config.fallbackColumn];
        }
        
        if (name) {
          var safeName2 = name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          spotNameEl.innerHTML = safeName2;
          
          var ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) {
            ogTitle.setAttribute('content', name + ' sur CrudiThé 🌱');
          }
          document.title = name + ' — CrudiThé';
        } else {
          spotNameEl.textContent = 'CrudiThé';
        }
      } catch (err) {
        console.log('Erreur fetch nom:', err);
        spotNameEl.textContent = 'CrudiThé';
      }
    }
    fetchSpotName();
  </script>
</body>
</html>
