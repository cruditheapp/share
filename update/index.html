<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mettre à jour CrudiThé</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f7f9f2; color: #1c261f; text-align: center; padding: 60px 24px; }
  h1 { color: #0b9444; font-size: 26px; }
  a { display: block; max-width: 340px; margin: 16px auto; padding: 18px; border-radius: 40px; background: #0b9444; color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
  a.android { background: #0b3320; }
</style>
</head>
<body>
  <h1>Mettre à jour CrudiThé 💚</h1>
  <p>Choisis ton store :</p>
  <a id="ios" href="https://apps.apple.com/app/id6756739944">App Store</a>
  <a id="android" class="android" href="https://play.google.com/store/apps/details?id=com.crudithe.app">Google Play</a>
  <script>
    var ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/i.test(ua)) { location.replace(document.getElementById('ios').href); }
    else if (/Android/i.test(ua)) { location.replace(document.getElementById('android').href); }
  </script>
</body>
</html>
